<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tender Package Builder</title>

<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#151a2c;--mu:#6a7390;--bd:#e3e7f2;--ac:#4f46e5;--ac2:#7c3aed;--ok:#059669;--okb:#d1fae5;--er:#dc2626;--erb:#fee2e2;--wa:#b45309;--wab:#fef3c7;--nb:#e8ebf5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1120;--card:#171b30;--tx:#e8ebf8;--mu:#9099b8;--bd:#272d4a;--okb:#06392c;--erb:#4a1620;--wab:#3d2a08;--nb:#242a48;--ok:#34d399;--er:#f87171;--wa:#fbbf24}}
:root[data-theme="dark"]{--bg:#0e1120;--card:#171b30;--tx:#e8ebf8;--mu:#9099b8;--bd:#272d4a;--okb:#06392c;--erb:#4a1620;--wab:#3d2a08;--nb:#242a48;--ok:#34d399;--er:#f87171;--wa:#fbbf24}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,'Hind Siliguri',system-ui,sans-serif}
body.bn{font-family:'Hind Siliguri',Inter,sans-serif}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:22px 20px 60px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:24px}.sub{opacity:.85;font-size:14px;margin-top:2px}
.lang{display:flex;background:rgba(255,255,255,.2);border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:#fff;padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit;font-weight:600}
.lang button.on{background:#fff;color:var(--ac)}
main{margin-top:-40px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px rgba(30,40,90,.06)}
h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.n{background:var(--ac);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px}
.btn{border:0;background:var(--ac);color:#fff;padding:9px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--nb);color:var(--tx)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:22px;text-align:center;color:var(--mu);cursor:pointer}
.drop.h{border-color:var(--ac);background:var(--nb)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.meta div{background:var(--bg);border-radius:10px;padding:8px 12px}.meta b{display:block;font-size:12px;color:var(--mu);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.file{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.file:last-child{border:0}.file .nm{flex:1;min-width:0;word-break:break-all}.file small{color:var(--mu)}
.doc{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.doc .hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ord{color:var(--mu);font-weight:600;margin-right:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--nb);color:var(--mu);margin-left:4px;white-space:nowrap}
.st{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.st.ok{background:var(--okb);color:var(--ok)}.st.er{background:var(--erb);color:var(--er)}.st.wa{background:var(--wab);color:var(--wa)}.st.ne{background:var(--nb);color:var(--mu)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
select,input[type=date]{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);max-width:100%}
select{flex:1;min-width:160px}
.note{font-size:13px;margin-top:6px}.note.er{color:var(--er)}.note.wa{color:var(--wa)}
.msg{background:var(--erb);color:var(--er);padding:8px 12px;border-radius:10px;margin-top:10px;font-size:14px}
.dup{background:var(--wab);color:var(--wa);font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600}
.why{background:var(--erb);color:var(--er);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:14px}
.why ul{margin:4px 0 0;padding-left:20px}
.empty{color:var(--mu);text-align:center;padding:14px}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.steps{list-style:none;display:flex;gap:8px;flex-wrap:wrap;padding:0;margin:0 0 16px}
.steps li{flex:1;min-width:130px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center;font-weight:600;color:var(--mu)}
.steps li span{width:24px;height:24px;border-radius:50%;background:var(--nb);display:grid;place-items:center;font-size:13px;flex:none}
.steps li.c{border-color:var(--ac);color:var(--tx)}.steps li.c span{background:var(--ac);color:#fff}.steps li.d span{background:var(--ok);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;color:var(--mu);font-size:13px}.sc b{display:block;font-size:24px;color:var(--tx)}
.okbox{background:var(--okb);color:var(--ok);padding:10px 14px;border-radius:10px;font-weight:600;margin-bottom:10px}
</style></head><body>

 return `<ol class="steps">${[1,2,3,4].map((n,i)=>`<li class="${done[i]?'d':i===cur?'c':''}" ${i===cur?'aria-current="step"':''}><span>${done[i]?'✓':n}</span>${t('st'+n)}</li>`).join('')}</ol>`}
function cards(){if(!S.req)return'';const st=S.docs.map(status),c=l=>st.filter(x=>x.l===l).length;
 const it=[['cTotal',S.docs.length],['cMatched',S.docs.filter(d=>S.match[d._id]).length],['cMissing',c('missing')],['cNeed',c('needDate')],['cExpired',c('expired')],['cReady',canGeneratePackage()?t('yes'):t('no')]];
 return `<div class="cards">${it.map(([k,v])=>`<div class="sc"><b>${v}</b>${t(k)}</div>`).join('')}</div>`}
function saveBlob(parts,type,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(parts,{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
const safeId=()=>String(S.req.tender.tender_id).replace(/[^\w.\-]+/g,'_');
function exportCsv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=[['document','file name','pages','expiry date','status']].concat(S.docs.map(d=>{const f=S.files.find(x=>x.id===S.match[d._id]);return[d.title_en,f?f.name:'',f?f.pages:'',S.exp[d._id]||'',T.en[status(d).l]]}));
 saveBlob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],'text/csv;charset=utf-8',safeId()+'_Checklist.csv')}
function render(){
 if(S.result&&S.result.sig!==sig())S.result=null;
 document.documentElement.lang=lang;document.body.className=lang;
 $('#t_title').textContent=t('title');$('#t_sub').textContent=t('sub')+' · 🔒 '+t('priv');
 $('#b_en').className=lang==='en'?'on':'';$('#b_bn').className=lang==='bn'?'on':'';
 const g=groups();let h=stepper()+cards()+`<div class="card"><h2><span class="n">1</span>${t('s1')}</h2>
 <div class="drop" id="rdrop">${t('loadHint')}<br><button class="btn" style="margin-top:8px" id="rbtn">${t('load')}</button></div>
 <input type="file" id="rin" accept=".json,.zip" hidden>`;
 if(S.req){const tn=S.req.tender,sk=[['tid',tn.tender_id],['ttitle',tn.title],['tent',tn.procuring_entity],['tbid',tn.bidder],['deadline',tn.submission_deadline],['tcount',S.docs.length]];
  h+=`<h2 style="margin-top:14px">${t('tender')}</h2><div class="meta">${sk.map(([k,v])=>`<div><b>${t(k)}</b>${esc(v)}</div>`).join('')}</div>`}
 h+=`</div>`;
 if(S.msgs.length)h+=S.msgs.map(m=>`<div class="msg">⚠ ${esc(m)}</div>`).join('');
 if(S.req){
 h+=`<div class="grid"><div class="card"><h2><span class="n">2</span>${t('s2')}</h2>
 <div class="drop" id="fdrop">${t('drop')}</div><input type="file" id="fin" accept=".pdf,application/pdf" multiple hidden>
 <div style="margin-top:8px">${S.files.length?S.files.map(f=>`<div class="file"><span>📄</span><div class="nm">${esc(f.name)} ${g[f.hash].length>1?`<span class="dup">⚠ ${t('dupTag')}</span>`:''}<br><small>${f.pages} ${t('pages')} • ${fmt(f.size)}</small>${g[f.hash].length>1?`<div class="note wa">${t('sameAs')}: ${esc(g[f.hash].filter(x=>x!==f).map(x=>x.name).join(', '))}</div>`:''}</div><button class="btn sec sm" data-rm="${f.id}">${t('remove')}</button></div>`).join(''):`<div class="empty">${t('none')}</div>`}</div></div>
 <div class="card"><h2><span class="n">3</span>${t('s3')}</h2>${deadline()?`<div class="note" style="margin:-4px 0 10px">${t('deadline')}: <b>${esc(deadline())}</b></div>`:''}
 ${S.docs.map(d=>{const s=status(d),cur=S.match[d._id];
  const takenHash=new Set(Object.entries(S.match).filter(([k])=>k!==d._id).map(([k,v])=>(S.files.find(x=>x.id===v)||{}).hash));
  const takenIds=new Set(Object.entries(S.match).filter(([k])=>k!==d._id).map(([k,v])=>v));
  return `<div class="doc"><div class="hd"><div><span class="ord">${d.order}.</span><b>${esc(title(d))}</b><span class="tag">${d.mandatory?t('mand'):t('opt')}</span>${d.has_expiry?`<span class="tag">${t('exp')}</span>`:''}</div><span class="st ${s.c}">${ic[s.l]} ${t(s.l)}</span></div>
  <div class="row"><label for="s_${d._id}">${t('file')}:</label><select id="s_${d._id}" data-m="${d._id}"><option value="">${t('sel')}</option>${S.files.map(f=>{const dis=takenIds.has(f.id)||takenHash.has(f.hash);return `<option value="${f.id}" ${cur===f.id?'selected':''} ${dis?'disabled':''}>${esc(f.name)}${dis?' ('+t(takenIds.has(f.id)?'usedA':'usedB')+')':''}</option>`}).join('')}</select>
  ${cur?`<button class="btn sec sm" data-um="${d._id}">${t('unmatch')}</button>`:sugHtml(d)}</div>
  ${cur&&d.has_expiry?`<div class="row"><label for="e_${d._id}">${t('expiry')}:</label><input id="e_${d._id}" type="date" data-e="${d._id}" value="${S.exp[d._id]||''}"></div>`:''}
  ${s.n?`<div class="note ${s.c}">${t(s.n)}</div>`:''}</div>`}).join('')}</div></div>`;
 const probs=blocking(),ok=!probs.length;
 h+=`<div class="card"><h2><span class="n">4</span>${t('s4')}</h2>
 ${ok?`<div class="okbox">✓ ${t('ready')}</div>`:`<div class="why" role="alert">⚠ ${probs.length} ${t('issuesN')}<ul>${probs.map(x=>`<li>${esc(title(x.d))} — ${ic[x.s.l]} ${t(x.s.l)}</li>`).join('')}</ul></div>`}
 <div class="row"><label><input type="checkbox" id="idx" ${S.idx?'checked':''}> ${t('idx')}</label></div>
 <div class="row"><button class="btn" id="gen" ${ok&&!S.busy?'':'disabled'}>${S.busy||t('gen')}</button><button class="btn sec" id="csv">${t('csv')}</button></div>
 ${S.result?`<div class="okbox" role="status" style="margin-top:12px">✓ ${t('success')}<br><b>${S.result.pages} ${t('pages')} · ${S.result.docs} ${t('docsN')}</b><div class="row"><button class="btn" id="dl">⬇ ${t('dl')}</button><small>${esc(S.result.name)}</small></div></div>`:''}</div>`}
 $('#app').innerHTML=h;bind()}
function bind(){
 const ri=$('#rin');$('#rbtn').onclick=e=>{e.stopPropagation();ri.click()};ri.onchange=()=>ri.files[0]&&loadReqFile(ri.files[0]);
 const rd=$('#rdrop');rd.ondragover=e=>{e.preventDefault();rd.classList.add('h')};rd.ondragleave=()=>rd.classList.remove('h');
 rd.ondrop=e=>{e.preventDefault();rd.classList.remove('h');e.dataTransfer.files[0]&&loadReqFile(e.dataTransfer.files[0])};
 if(!S.req)return;
 const fi=$('#fin'),fd=$('#fdrop');fd.onclick=()=>fi.click();fd.tabIndex=0;fd.setAttribute('role','button');fd.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fi.click()}};fi.onchange=()=>{S.msgs=[];addFiles([...fi.files])};
 fd.ondragover=e=>{e.preventDefault();fd.classList.add('h')};fd.ondragleave=()=>fd.classList.remove('h');
 fd.ondrop=e=>{e.preventDefault();fd.classList.remove('h');S.msgs=[];addFiles([...e.dataTransfer.files])};
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const id=+b.dataset.rm;S.files=S.files.filter(f=>f.id!==id);for(const k in S.match)if(S.match[k]===id)delete S.match[k];render()});
 document.querySelectorAll('[data-m]').forEach(s=>s.onchange=()=>{if(s.value)S.match[s.dataset.m]=+s.value;else delete S.match[s.dataset.m];render()});
 document.querySelectorAll('[data-um]').forEach(b=>b.onclick=()=>{delete S.match[b.dataset.um];render()});
 document.querySelectorAll('[data-e]').forEach(i=>i.onchange=()=>{S.exp[i.dataset.e]=i.value;render()});
 document.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>{const v=b.dataset.ac,i=v.lastIndexOf(':');S.match[v.slice(0,i)]=+v.slice(i+1);render()});
 $('#idx').onchange=e=>{S.idx=e.target.checked;render()};$('#csv').onclick=exportCsv;const dl=$('#dl');if(dl)dl.onclick=()=>saveBlob([S.result.bytes],'application/pdf',S.result.name);
 $('#gen').onclick=generate}
async function generate(){
 if(!canGeneratePackage())return;
 S.busy=t('working');S.msgs=[];render();
 try{
  const out=await PDFLib.PDFDocument.create(),{StandardFonts,rgb}=PDFLib;
  const F=await out.embedFont(StandardFonts.Helvetica),B=await out.embedFont(StandardFonts.HelveticaBold);
  const tn=S.req.tender,inc=S.docs.map(d=>({d,f:S.files.find(x=>x.id===S.match[d._id])})).filter(x=>x.f);
  const n=new Date(),today=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  const W=595,H=842,M=56;let pg,y;
  const np=()=>{pg=out.addPage([W,H]);y=H-72};
  const txt=(s,o={})=>pg.drawText(asc(s),{x:M+(o.x||0),y,size:o.size||11,font:o.b?B:F,color:o.c||rgb(.1,.1,.15)});
  const wrap=(s,size,font,max)=>{const r=[];let ln='';for(const w of asc(s).split(/\s+/)){const tt=ln?ln+' '+w:w;if(font.widthOfTextAtSize(tt,size)>max&&ln){r.push(ln);ln=w}else ln=tt}r.push(ln);return r};
  np();pg.drawRectangle({x:0,y:H-14,width:W,height:14,color:rgb(.31,.27,.9)});
  txt('TENDER DOCUMENT PACKAGE',{size:22,b:1});y-=44;
  for(const[k,v]of[['Tender ID',tn.tender_id],['Tender Title',tn.title],['Procuring Entity',tn.procuring_entity],['Bidder',tn.bidder],['Submission Deadline',fdate(tn.submission_deadline)],['Package Created',fdate(today)]]){
   txt(k+':',{size:9,b:1,c:rgb(.4,.43,.55)});y-=15;for(const l of wrap(v,12,F,W-2*M)){txt(l,{size:12});y-=16}y-=8}
  y-=6;txt('INCLUDED DOCUMENTS',{size:13,b:1});y-=22;
  inc.forEach((x,i)=>{if(y<80)np();txt(wrap(`${i+1}. ${x.d.title_en}`,11,F,W-2*M)[0]);y-=18});
  if(S.idx){const per=40,ip=Math.ceil(inc.length/per);let st=out.getPageCount()+ip+1;const starts=inc.map(x=>{const a=st;st+=x.f.pages;return a});
   for(let p=0;p<ip;p++){np();if(!p){txt('DOCUMENT INDEX',{size:18,b:1});y-=34}
    inc.slice(p*per,(p+1)*per).forEach((x,j)=>{const i=p*per+j,s=`Page ${starts[i]}`;txt(`${i+1}. `+wrap(x.d.title_en,11,F,380)[0]);txt(s,{x:W-2*M-F.widthOfTextAtSize(s,11)});y-=18})}}
  const FB=36;
  for(const x of inc){
   const src=await PDFLib.PDFDocument.load(x.f.buf,{ignoreEncryption:true}),ix=src.getPageIndices(),ems=await out.embedPdf(src,ix);
   for(const i of ix){
    if(src.getPage(i).getRotation().angle%360===0){const em=ems[i],p=out.addPage([em.width,em.height+FB]);p.drawPage(em,{x:0,y:FB})}
    else{const[cp]=await out.copyPages(src,[i]);out.addPage(cp)}}}
  const pages=out.getPages(),Y=pages.length;
  pages.forEach((p,i)=>{const s=asc(`${tn.tender_id} | Page ${i+1} of ${Y}`),mb=p.getMediaBox();
   p.drawText(s,{x:mb.x+(mb.width-F.widthOfTextAtSize(s,9))/2,y:mb.y+14,size:9,font:F,color:rgb(.25,.25,.3)})});
  const bytes=await out.save();
  S.result={bytes,pages:Y,docs:inc.length,name:safeId()+'_Package.pdf',sig:sig()};
 }catch(e){S.msgs=['Error: '+e.message];S.result=null}
 S.busy='';render()}
function setLang(l){lang=l;try{localStorage.setItem('lang',l)}catch(e){}render()}
$('#b_en').onclick=()=>setLang('en');$('#b_bn').onclick=()=>setLang('bn');
render();
</script></body></html>
